name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # Real PostgreSQL via embedded binaries: RLS, tenant isolation, ledger guards, API e2e.
      - run: pnpm test:integration
      - name: OpenAPI contract is up to date
        run: pnpm --filter @manuling/core openapi && git diff --exit-code docs/api/openapi.json
      - name: Event schemas are up to date
        run: pnpm --filter @manuling/core events:schemas && git diff --exit-code docs/events
